<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📝Pinnpen</title>
<style>
  :root { --bg:#f6f4ef; --dot:#dcd7cc; --ink:#2b2b2b; --line:#ddd; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); }

  html { -webkit-text-size-adjust:100%; }

  #toolbar { position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:6px;
             padding:0 12px; background:#fff; border-bottom:1px solid var(--line); z-index:100000;
             overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #toolbar::-webkit-scrollbar { display:none; }
  #toolbar > * { flex-shrink:0; white-space:nowrap; }
  #toolbar .title { font-weight:700; margin-right:8px; }
  #toolbar button { font:inherit; font-size:13px; padding:5px 10px; border:1px solid #ccc; background:#fafafa;
                    border-radius:6px; cursor:pointer; color:var(--ink); -webkit-appearance:none; appearance:none; }
  #toolbar button:hover { background:#f0f0f0; }
  #toolbar button.primary { background:#2b2b2b; color:#fff; border-color:#2b2b2b; }
  #status { font-size:12px; color:#888; margin-left:6px; }
  #defColor { display:flex; align-items:center; gap:6px; margin-left:4px; padding-left:10px; border-left:1px solid var(--line);
              font-size:12px; color:#888; }
  #defColor button { width:16px; height:16px; padding:0; border-radius:50%; border:1px solid rgba(0,0,0,.2); }
  #defColor button:hover { transform:scale(1.12); }
  #defColor button.sel { outline:1.5px solid #333; outline-offset:1.5px; }
  #defColor button.custom { background:conic-gradient(#ff6b6b, #ffd43b, #69db7c, #4dabf7, #b197fc, #ff6b6b); }
  #defColor { position:relative; }
  #help { margin-left:auto; flex-shrink:1; min-width:0; font-size:12px; color:#888; overflow:hidden; text-overflow:ellipsis; }

  #board { position:relative; margin-top:46px; min-width:100vw; min-height:calc(100vh - 46px);
           background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:24px 24px; cursor:text; }

  .note { position:absolute; width:200px; min-width:110px; max-width:900px; border-radius:4px;
          box-shadow:0 1px 2px rgba(0,0,0,.12), 0 3px 10px rgba(0,0,0,.08);
          display:flex; flex-direction:column; overflow:hidden; cursor:default; }
  .note .grip { position:absolute; right:0; bottom:0; width:14px; height:14px; cursor:nwse-resize; touch-action:none;
                background:linear-gradient(135deg, transparent 0 52%, rgba(0,0,0,.28) 52% 59%, transparent 59% 70%,
                                           rgba(0,0,0,.28) 70% 77%, transparent 77%); }
  .note:focus-within { box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.15); }
  .note .bar { height:18px; flex:none; display:flex; justify-content:flex-end; align-items:center; gap:2px; padding:0 3px;
               cursor:move; background:rgba(0,0,0,.06); touch-action:none; }
  .note .bar button { opacity:0; border:0; background:transparent; cursor:pointer; width:20px; height:17px; padding:0;
                      display:flex; align-items:center; justify-content:center; border-radius:3px; color:#555; }
  .note .bar button svg { display:block; pointer-events:none; }
  .note:hover .bar button, .note:focus-within .bar button { opacity:1; }
  .note .bar button:hover { background:rgba(0,0,0,.1); }
  .note textarea { border:0; background:transparent; resize:none; outline:none; overflow:hidden;
                   font:inherit; font-size:10pt; line-height:1.5; padding:6px 10px 10px; min-height:34px; color:var(--ink); }
  .note.dragging { opacity:.85; box-shadow:0 10px 24px rgba(0,0,0,.2); }

  /* 다중 선택 */
  .note.selected { box-shadow:0 0 0 2px #2f7cf6, 0 4px 14px rgba(47,124,246,.25); }
  #marquee { position:absolute; display:none; border:1px solid #2f7cf6; background:rgba(47,124,246,.10);
             pointer-events:none; z-index:2147483000; }
  /* 확대/축소: 메모들은 #canvas 안에서 transform:scale 로 함께 커지고 작아짐 */
  #canvas { position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0; }
  /* 워터마크: 화면 우하단 고정, 클릭·선택 방해 없음 */
  #watermark { position:fixed; right:14px; bottom:10px; z-index:99999; pointer-events:none; user-select:none;
               -webkit-user-select:none; font-size:12px; font-style:italic; color:#c7c7cc; white-space:nowrap; }
  #zoomBox { display:flex; align-items:center; gap:3px; margin-left:4px; padding-left:10px; border-left:1px solid var(--line); }
  #toolbar #zoomBox button { padding:3px 8px; min-width:26px; }
  #toolbar #zoomBox #zoomLevel { min-width:52px; }
  body.marquee-on, body.marquee-on * { user-select:none; -webkit-user-select:none; cursor:crosshair; }

  #palette { position:fixed; display:none; gap:6px; padding:6px 8px; background:#fff; border:1px solid #ddd;
             border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:150000; }
  #palette.open { display:flex; }
  #palette button { width:18px; height:18px; padding:0; border-radius:50%; border:1px solid rgba(0,0,0,.18); cursor:pointer; }
  #palette button:hover { transform:scale(1.12); }
  #palette button.sel { outline:1.5px solid #333; outline-offset:1.5px; }
  #palette button.custom { background:conic-gradient(#ff6b6b, #ffd43b, #69db7c, #4dabf7, #b197fc, #ff6b6b); }
  /* 무지개 버튼 위에 투명한 색 입력칸을 겹쳐, 손가락/마우스가 입력칸을 직접 누르게 함
     (iOS Safari는 스크립트로 대신 누른 클릭으로는 색상 선택 창을 열지 않음) */
  .color-wrap { position:relative; display:inline-flex; }
  .color-wrap input[type=color] { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:0;
                                  opacity:0; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #emojiPop { position:fixed; display:none; grid-template-columns:repeat(8, 24px); gap:2px; padding:5px; background:#fff;
              border:1px solid #ddd; border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index:150000; }
  #emojiPop.open { display:grid; }
  #emojiPop button { width:24px; height:24px; padding:0; border:0; background:transparent; border-radius:4px;
                     font-size:15px; line-height:24px; cursor:pointer; }
  #emojiPop button:hover { background:#f0f0f0; }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:200000; }
  #modal.open { display:flex; }
  #modal .box { background:#fff; width:min(720px, 94vw); max-height:88vh; display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:10px; }
  #modal .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; }
  #modal select, #modal button { font:inherit; font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid #ccc; background:#fafafa; cursor:pointer; }
  #modal textarea { width:100%; height:50vh; font:inherit; font-size:14px; line-height:1.5; padding:10px; border:1px solid #ddd; border-radius:6px; resize:vertical; }
  #modal .actions { display:flex; justify-content:flex-end; gap:8px; align-items:center; }
  #copyMsg { font-size:12px; color:#2a7; margin-right:auto; }
  #scopeNote { font-size:12px; color:#2f7cf6; }

  /* 휴대폰 등 좁은 화면 */
  @media (max-width: 700px) {
    #toolbar { gap:4px; padding:0 8px; }
    #toolbar .title { font-size:14px; margin-right:4px; }
    #toolbar button { font-size:12px; padding:4px 8px; }
    #help { display:none; }
    .note textarea { font-size:16px; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">📝Pinnpen</span>
  <button class="primary" id="btnCopy" title="Collect note text in layout order">Collect &amp; Copy</button>
  <button id="btnExport" title="Back up to a JSON file">Export</button>
  <button id="btnImport" title="Restore from a backup file">Import</button>
  <button id="btnClear">Clear All</button>
  <span id="zoomBox">
    <button id="zoomOut" title="Zoom out (Ctrl + mouse wheel)">−</button>
    <button id="zoomLevel" title="Reset to 100%">100%</button>
    <button id="zoomIn" title="Zoom in (Ctrl + mouse wheel)">+</button>
    <button id="zoomFit" title="Fit all notes on screen">Fit</button>
  </span>
  <span id="defColor" title="Color for new notes"><span class="lbl">New note</span></span>
  <span id="status"></span>
  <span id="help">Click: new note · Ctrl+click / drag area: select · Drag top bar: move · Drag corner: resize · Esc: done · Ctrl+Z: undo delete · Ctrl+wheel: zoom</span>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>

<div id="board"><div id="canvas"><div id="marquee"></div></div></div>
<div id="watermark">© kuromi learns to code</div>
<div id="palette"></div>
<div id="emojiPop"></div>

<div id="modal">
  <div class="box">
    <div class="row">
      <label>Order
        <select id="optOrder">
          <option value="row">Rows (top→bottom, left→right)</option>
          <option value="col">Columns (left→right, top→bottom)</option>
        </select>
      </label>
      <label>Format
        <select id="optFormat">
          <option value="blank">Blank lines</option>
          <option value="bullet">Bullets (- )</option>
          <option value="number">Numbered (1. )</option>
        </select>
      </label>
      <span id="scopeNote"></span>
    </div>
    <textarea id="outText" spellcheck="false"></textarea>
    <div class="actions">
      <span id="copyMsg"></span>
      <button id="btnDoCopy">Copy</button>
      <button id="btnClose">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORE_KEY = 'freeMemoBoard.v1';
  // 표준 포스트잇 4색: 카나리 옐로 / 핑크 / 블루 / 그린
  const COLORS = ['#fff59d', '#ffc1d6', '#b3e0fb', '#c5eba4'];
  const COLOR_NAMES = ['Yellow', 'Pink', 'Blue', 'Green'];

  // ---------- 새 메모 기본 색상 (메뉴 바에서 선택, 브라우저에 기억) ----------
  // defaultColor: 0~3 = 기본 4색, '#rrggbb' = 사용자 지정 색
  const DEF_KEY = 'pinpen.defaultColor';
  const CUSTOM_KEY = 'pinpen.customColor';
  const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
  const colorOf = c => isHex(c) ? c : COLORS[(c || 0) % COLORS.length];   // 메모 색 값 → 실제 색
  let defaultColor = 0;   // 기본: 연노랑
  let customColor = null;
  try {
    const raw = localStorage.getItem(DEF_KEY);
    if (isHex(raw)) defaultColor = raw;
    else { const v = parseInt(raw, 10); if (v >= 0 && v < COLORS.length) defaultColor = v; }
    const cc = localStorage.getItem(CUSTOM_KEY);
    if (isHex(cc)) customColor = cc;
  } catch (e) {}
  function setDefault(v) {
    defaultColor = v;
    try { localStorage.setItem(DEF_KEY, String(v)); } catch (e) {}
    paintDefColor();
  }
  const defBox = document.getElementById('defColor');
  const defBtns = COLORS.map((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    b.title = 'New notes: ' + COLOR_NAMES[i];
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => setDefault(i));
    defBox.appendChild(b);
    return b;
  });

  // 다섯 번째: 사용자 지정 색 (브라우저 기본 색상 선택 창 사용 — 팔레트, RGB, HEX 입력 포함)
  const customBtn = document.createElement('button');
  customBtn.className = 'custom';
  customBtn.title = 'New notes: custom color…';
  customBtn.tabIndex = -1;
  const colorInput = document.createElement('input');
  colorInput.type = 'color';
  colorInput.title = customBtn.title;
  colorInput.value = customColor || '#ffd8a8';
  // 입력칸을 직접 누르면 색상 선택 창이 열림 (PC·아이폰 공통)
  colorInput.addEventListener('click', () => {
    if (customColor) setDefault(customColor);     // 이미 만든 색이 있으면 바로 선택
    colorInput.value = customColor || '#ffd8a8';
  });
  colorInput.addEventListener('input', () => { customBtn.style.background = colorInput.value; });
  colorInput.addEventListener('change', () => {
    customColor = colorInput.value.toLowerCase();
    try { localStorage.setItem(CUSTOM_KEY, customColor); } catch (e) {}
    setDefault(customColor);
  });
  const defWrap = document.createElement('span');
  defWrap.className = 'color-wrap';
  defWrap.append(customBtn, colorInput);
  defBox.appendChild(defWrap);

  function paintDefColor() {
    defBtns.forEach((b, i) => b.classList.toggle('sel', i === defaultColor));
    customBtn.classList.toggle('sel', isHex(defaultColor));
    customBtn.style.background = customColor || '';   // 아직 없으면 무지개 아이콘
  }
  paintDefColor();

  // 상단 바 아이콘: 글꼴에 따라 크기가 달라지지 않도록 같은 크기의 SVG로 통일
  const SVG = d => `<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">${d}</svg>`;
  const ICON_COLOR = SVG('<circle cx="8" cy="8" r="6.25"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor" stroke="none"/>');
  const ICON_EMOJI = SVG('<circle cx="8" cy="8" r="6.25"/><circle cx="5.9" cy="6.5" r=".9" fill="currentColor" stroke="none"/><circle cx="10.1" cy="6.5" r=".9" fill="currentColor" stroke="none"/><path d="M5.2 9.6a3.3 3.3 0 0 0 5.6 0"/>');
  const ICON_DEL   = SVG('<path d="M4 4l8 8M12 4l-8 8"/>');
  const board = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // ---------- 확대 / 축소 ----------
  const ZOOM_KEY = 'pinpen.zoom';
  const ZOOM_STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
  let zoom = 1;
  try { const z = parseFloat(localStorage.getItem(ZOOM_KEY)); if (z >= 0.25 && z <= 2) zoom = z; } catch (e) {}

  // z 배율로 바꾸면서 화면의 (ax, ay) 지점이 제자리에 머물도록 스크롤 보정
  function setZoom(z, ax, ay) {
    z = Math.min(2, Math.max(0.25, Math.round(z * 100) / 100));
    if (ax === undefined) { ax = window.innerWidth / 2; ay = (window.innerHeight + 46) / 2; }
    const r = board.getBoundingClientRect();
    const px = (ax - r.left) / zoom, py = (ay - r.top) / zoom;   // 고정할 지점 (보드 좌표)
    const old = zoom;
    zoom = z;
    applyZoom();
    window.scrollBy(px * (z - old), py * (z - old));
    try { localStorage.setItem(ZOOM_KEY, String(z)); } catch (e) {}
  }
  function applyZoom() {
    canvas.style.transform = `scale(${zoom})`;
    board.style.backgroundSize = `${24 * zoom}px ${24 * zoom}px`;
    document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
    if (typeof fitBoard === 'function') fitBoard();
  }
  function stepZoom(dir, ax, ay) {
    const next = dir > 0 ? ZOOM_STEPS.find(s => s > zoom + 0.001) : [...ZOOM_STEPS].reverse().find(s => s < zoom - 0.001);
    if (next) setZoom(next, ax, ay);
  }
  // 모든 메모가 한 화면에 들어오게 (축소만, 100%보다 키우지는 않음)
  function zoomToFit() {
    if (!notes.length) { setZoom(1); return; }
    let x1 = Infinity, y1 = Infinity, x2 = 0, y2 = 0;
    notes.forEach(n => {
      const el = elOf(n);
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + (el ? el.offsetWidth : n.w)); y2 = Math.max(y2, n.y + (el ? el.offsetHeight : 60));
    });
    const pad = 40;
    const z = Math.min(1, Math.max(0.25, Math.min((window.innerWidth - pad) / (x2 - x1 + pad), (window.innerHeight - 46 - pad) / (y2 - y1 + pad))));
    zoom = Math.floor(z * 100) / 100;
    applyZoom();
    window.scrollTo(Math.max(0, x1 * zoom - pad / 2), Math.max(0, y1 * zoom - pad / 2));
    try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) {}
  }
  document.getElementById('zoomIn').addEventListener('click', () => stepZoom(1));
  document.getElementById('zoomOut').addEventListener('click', () => stepZoom(-1));
  document.getElementById('zoomLevel').addEventListener('click', () => setZoom(1));
  document.getElementById('zoomFit').addEventListener('click', zoomToFit);
  // Ctrl + 마우스 휠: 커서 위치를 중심으로 확대/축소 (브라우저 전체 확대 대신)
  window.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    stepZoom(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
  }, { passive: false });

  let notes = [];          // {id, x, y, w, text, color, z}
  let maxZ = 1;
  let lastDeleted = null;
  let saveTimer = null;
  let wasEditing = false;
  let paletteNote = null;
  let paletteJustClosed = false;
  let suppressClick = false;

  // ---------- 다중 선택 ----------
  const selected = new Set();   // 선택된 메모 id
  function selectedNotes() { return notes.filter(n => selected.has(n.id)); }
  function paintSelection() {
    board.querySelectorAll('.note').forEach(el => el.classList.toggle('selected', selected.has(el.dataset.id)));
    statusEl.textContent = selected.size ? `${selected.size} selected · Del: delete · Esc: clear` : '';
  }
  function setSelection(ids) { selected.clear(); ids.forEach(id => selected.add(id)); paintSelection(); }
  function clearSelection() { if (selected.size) { selected.clear(); paintSelection(); } }
  function toggleSelect(n) { selected.has(n.id) ? selected.delete(n.id) : selected.add(n.id); paintSelection(); }

  // ---------- 색 선택 팝업 ----------
  const palette = document.getElementById('palette');
  const swatches = COLORS.map((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    b.title = COLOR_NAMES[i];
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => applyNoteColor(paletteNote, i));
    palette.appendChild(b);
    return b;
  });

  // 메모에 색 적용 (선택된 메모 중 하나에서 고르면 선택된 메모 전체에 적용)
  function applyNoteColor(n, value) {
    if (!n || !elOf(n)) return;
    const group = selected.has(n.id) && selected.size > 1 ? selectedNotes() : [n];
    group.forEach(g => { g.color = value; const ge = elOf(g); if (ge) ge.style.background = colorOf(value); });
    const el = elOf(n);
    if (group.length === 1) el.querySelector('textarea').focus();   // 바로 이어서 입력 가능
    closePalette();
    save();
  }

  // 다섯 번째: 사용자 지정 색 (브라우저 기본 색상 선택 창)
  const noteCustomBtn = document.createElement('button');
  noteCustomBtn.className = 'custom';
  noteCustomBtn.title = 'Custom color…';
  noteCustomBtn.tabIndex = -1;
  const noteColorInput = document.createElement('input');
  noteColorInput.type = 'color';
  noteColorInput.title = noteCustomBtn.title;
  let customTarget = null;
  // 입력칸을 직접 누르면 색상 선택 창이 열림 (PC·아이폰 공통)
  noteColorInput.addEventListener('click', () => {
    const n = paletteNote;
    if (!n) return;
    customTarget = n;
    noteColorInput.value = isHex(n.color) ? n.color : (customColor || '#ffd8a8');
  });
  noteColorInput.addEventListener('change', () => {
    const n = customTarget;
    customTarget = null;
    if (!n) return;
    if (paletteNote !== n) paletteNote = n;   // 선택 창을 쓰는 동안 팝업이 닫혔어도 적용
    applyNoteColor(n, noteColorInput.value.toLowerCase());
  });
  const noteWrap = document.createElement('span');
  noteWrap.className = 'color-wrap';
  noteWrap.append(noteCustomBtn, noteColorInput);
  palette.appendChild(noteWrap);

  function openPalette(n, btn) {
    if (emojiNote) closeEmoji();
    paletteNote = n;
    swatches.forEach((b, i) => b.classList.toggle('sel', !isHex(n.color) && i === (n.color || 0) % COLORS.length));
    noteCustomBtn.classList.toggle('sel', isHex(n.color));
    noteCustomBtn.style.background = isHex(n.color) ? n.color : '';
    palette.classList.add('open');
    placePopup(palette, btn);   // 메모 위쪽에 표시 (공간이 없으면 아래쪽)
  }

  function closePalette() {
    const n = paletteNote;
    palette.classList.remove('open');
    paletteNote = null;
    // 색만 고르다 닫은 빈 메모 정리
    if (n && !(n.text || '').trim()) {
      const el = elOf(n);
      if (el && !el.contains(document.activeElement)) removeNote(n, false);
    }
  }

  // 팝업 바깥을 누르면 닫기 (이때 빈 곳 클릭으로 새 메모가 생기지 않게)
  document.addEventListener('pointerdown', e => {
    if (!palette.classList.contains('open')) return;
    if (palette.contains(e.target) || e.target.closest('.note .c')) return;
    closePalette();
    paletteJustClosed = true;
  }, true);
  document.addEventListener('pointerdown', () => { paletteJustClosed = false; });   // 보드 밖 클릭이면 플래그 해제
  window.addEventListener('scroll', () => { if (paletteNote) closePalette(); if (emojiNote) closeEmoji(); });

  // ---------- 이모지 팝업 ----------
  const EMOJIS = ['✅','❌','⭐','💡','📌','❗','❓','⚠️',
                  '🔥','🎯','👉','👍','🤔','😀','❤️','🚀',
                  '📅','⏰','📝','📊','🔍','🔗','💰','✏️'];
  const emojiPop = document.getElementById('emojiPop');
  let emojiNote = null;
  EMOJIS.forEach(em => {
    const b = document.createElement('button');
    b.textContent = em;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      const n = emojiNote;
      const el = n && elOf(n);
      if (!el) return;
      const ta = el.querySelector('textarea');
      ta.focus();
      ta.setRangeText(em, ta.selectionStart, ta.selectionEnd, 'end');   // 커서 위치에 삽입
      ta.dispatchEvent(new Event('input'));
      closeEmoji();
    });
    emojiPop.appendChild(b);
  });

  function placePopup(pop, btn) {
    const r = btn.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.right - pw, window.innerWidth - pw - 8)) + 'px';
    const above = r.top - ph - 6;
    pop.style.top = (above >= 50 ? above : r.bottom + 6) + 'px';
  }

  function openEmoji(n, btn) {
    if (paletteNote) closePalette();
    emojiNote = n;
    emojiPop.classList.add('open');
    placePopup(emojiPop, btn);
  }

  function closeEmoji() {
    const n = emojiNote;
    emojiPop.classList.remove('open');
    emojiNote = null;
    if (n && !(n.text || '').trim()) {
      const el = elOf(n);
      if (el && !el.contains(document.activeElement)) removeNote(n, false);
    }
  }

  document.addEventListener('pointerdown', e => {
    if (!emojiPop.classList.contains('open')) return;
    if (emojiPop.contains(e.target) || e.target.closest('.note .e')) return;
    closeEmoji();
    paletteJustClosed = true;
  }, true);

  // ---------- 저장 / 불러오기 ----------
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, notes }));
        statusEl.textContent = 'Saved ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        statusEl.textContent = '⚠ Auto-save failed — please Export a backup';
      }
    }, 300);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data.notes)) notes = data.notes.filter(n => (n.text || '').trim());
      }
    } catch (e) { notes = []; }
    renderAll();
  }

  function renderAll() {
    board.querySelectorAll('.note').forEach(el => el.remove());
    selected.clear();
    statusEl.textContent = '';
    maxZ = 1;
    notes.forEach(n => { maxZ = Math.max(maxZ, n.z || 1); makeNoteEl(n); });
    fitBoard();
  }

  // ---------- 메모 요소 ----------
  // 글 높이에 맞춰 입력칸 높이를 잡고, 메모가 더 크면 남는 공간을 채움
  function autosize(ta) {
    ta.style.flex = 'none';
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
    ta.style.flex = '1 1 auto';
  }

  function elOf(n) { return board.querySelector(`.note[data-id="${n.id}"]`); }

  function bringFront(n) {
    if (n.z === maxZ) return;
    n.z = ++maxZ;
    const el = elOf(n);
    if (el) el.style.zIndex = n.z;
  }

  function makeNoteEl(n) {
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.id = n.id;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = (n.w || 200) + 'px';
    if (n.h) el.style.minHeight = n.h + 'px';
    el.style.background = colorOf(n.color);
    el.style.zIndex = n.z || 1;
    el.innerHTML =
      '<div class="bar"><button class="c" title="Color">' + ICON_COLOR + '</button><button class="e" title="Emoji">' + ICON_EMOJI + '</button><button class="d" title="Delete">' + ICON_DEL + '</button></div>' +
      '<textarea rows="1" spellcheck="false"></textarea><div class="grip" title="Resize"></div>';

    const bar = el.querySelector('.bar');
    const ta = el.querySelector('textarea');
    ta.value = n.text || '';

    ta.addEventListener('input', () => { n.text = ta.value; autosize(ta); save(); fitBoard(); });
    ta.addEventListener('focus', () => bringFront(n));
    // 빈 메모는 포커스가 메모 밖으로 완전히 나갔을 때만 정리 (색 선택 중에는 유지)
    ta.addEventListener('blur', () => setTimeout(() => {
      if (!ta.value.trim() && !el.contains(document.activeElement) && paletteNote !== n && emojiNote !== n) removeNote(n, false);
    }, 0));
    ta.addEventListener('keydown', e => { if (e.key === 'Escape') ta.blur(); });

    // 상단 바 버튼을 눌러도 입력 커서가 빠져나가지 않도록
    bar.addEventListener('mousedown', e => e.preventDefault());

    // Ctrl(⌘)+클릭: 선택 추가/해제 · 일반 클릭: 선택 해제 (단, 선택된 메모의 상단 바는 묶음 이동용)
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('button') || e.target.closest('.grip')) return;
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        e.stopPropagation();
        if (el.contains(document.activeElement) && (n.text || '').trim()) document.activeElement.blur();
        toggleSelect(n);
        return;
      }
      if (!(selected.has(n.id) && e.target.closest('.bar'))) clearSelection();
    }, true);
    el.addEventListener('mousedown', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, true);

    el.querySelector('.c').addEventListener('click', e => {
      if (paletteNote === n) closePalette();
      else openPalette(n, e.currentTarget);
    });
    el.querySelector('.e').addEventListener('click', e => {
      if (emojiNote === n) closeEmoji();
      else openEmoji(n, e.currentTarget);
    });
    el.querySelector('.d').addEventListener('click', () => {
      if (paletteNote === n) closePalette();
      if (emojiNote === n) closeEmoji();
      removeNote(n, true);
    });

    // 드래그 이동
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      bar.setPointerCapture(e.pointerId);
      // 선택된 메모를 끌면 선택된 메모 전체가 함께 이동
      const group = selected.has(n.id) && selected.size > 1 ? selectedNotes() : [n];
      const starts = group.map(g => ({ g, gel: elOf(g), ox: g.x, oy: g.y }));
      const minX = Math.min(...starts.map(s => s.ox)), minY = Math.min(...starts.map(s => s.oy));
      starts.forEach(s => { if (s.g !== n) bringFront(s.g); if (s.gel) s.gel.classList.add('dragging'); });
      bringFront(n);
      const sx = e.clientX, sy = e.clientY;
      const move = ev => {
        const dx = Math.max(-minX, (ev.clientX - sx) / zoom), dy = Math.max(-minY, (ev.clientY - sy) / zoom);
        starts.forEach(s => {
          s.g.x = Math.round(s.ox + dx);
          s.g.y = Math.round(s.oy + dy);
          if (s.gel) { s.gel.style.left = s.g.x + 'px'; s.gel.style.top = s.g.y + 'px'; }
        });
      };
      const up = () => {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        bar.removeEventListener('pointercancel', up);
        starts.forEach(s => s.gel && s.gel.classList.remove('dragging'));
        save(); fitBoard();
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
      bar.addEventListener('pointercancel', up);
    });

    // 오른쪽 아래 모서리: 대각선 크기 조절 (높이는 내용보다 작아지지 않음)
    const grip = el.querySelector('.grip');
    grip.addEventListener('mousedown', e => e.preventDefault());
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      grip.setPointerCapture(e.pointerId);
      bringFront(n);
      const sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
      const move = ev => {
        n.w = Math.min(900, Math.max(110, Math.round(ow + (ev.clientX - sx) / zoom)));
        n.h = Math.max(52, Math.round(oh + (ev.clientY - sy) / zoom));
        el.style.width = n.w + 'px';
        el.style.minHeight = n.h + 'px';
        autosize(ta);
      };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        n.h = el.offsetHeight;                 // 실제 높이로 저장
        el.style.minHeight = n.h + 'px';
        save(); fitBoard();
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });

    canvas.appendChild(el);
    autosize(ta);
    return el;
  }

  function removeNote(n, remember) {
    const i = notes.indexOf(n);
    if (i < 0) return;
    notes.splice(i, 1);
    selected.delete(n.id);
    const el = elOf(n);
    if (el) el.remove();
    if (remember && (n.text || '').trim()) {
      lastDeleted = [{ ...n }];
      statusEl.textContent = 'Deleted (Ctrl+Z to undo)';
    }
    save();
  }

  function deleteSelected() {
    const list = selectedNotes();
    if (!list.length) return;
    if (paletteNote) closePalette();
    if (emojiNote) closeEmoji();
    list.forEach(n => removeNote(n, false));
    lastDeleted = list.filter(n => (n.text || '').trim()).map(n => ({ ...n }));
    selected.clear();
    statusEl.textContent = `${list.length} deleted (Ctrl+Z to undo)`;
  }

  function addNote(x, y) {
    const n = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      x: Math.max(0, Math.round(x - 12 / zoom)),
      y: Math.max(0, Math.round(y - 24 / zoom)),
      w: 200, text: '', color: defaultColor, z: ++maxZ
    };
    notes.push(n);
    const el = makeNoteEl(n);
    el.querySelector('textarea').focus();
    fitBoard();
  }

  // 보드 크기를 메모 범위에 맞게 넓힘 (스크롤로 계속 확장 가능)
  function fitBoard() {
    let mx = 0, my = 0;
    notes.forEach(n => {
      const el = elOf(n);
      mx = Math.max(mx, n.x + (el ? el.offsetWidth : n.w));
      my = Math.max(my, n.y + (el ? el.offsetHeight : 60));
    });
    board.style.width = Math.max(window.innerWidth, (mx + 600) * zoom) + 'px';
    board.style.height = Math.max(window.innerHeight - 46, (my + 500) * zoom) + 'px';
  }

  // ---------- 빈 곳 클릭 → 새 메모 ----------
  board.addEventListener('pointerdown', () => {
    const a = document.activeElement;
    wasEditing = !!(a && a.tagName === 'TEXTAREA' && a.closest('.note')) || paletteJustClosed;
    paletteJustClosed = false;
    suppressClick = false;
  });

  // ---------- 빈 곳에서 드래그 → 영역 선택 (마우스 전용, 터치는 스크롤 유지) ----------
  const marquee = document.getElementById('marquee');
  board.addEventListener('pointerdown', e => {
    if (e.target !== board || e.button !== 0 || e.pointerType !== 'mouse') return;
    const r0 = board.getBoundingClientRect();
    const sx = (e.clientX - r0.left) / zoom, sy = (e.clientY - r0.top) / zoom;
    const base = (e.ctrlKey || e.metaKey) ? new Set(selected) : new Set();   // Ctrl+드래그: 기존 선택에 추가
    let active = false;
    const move = ev => {
      const r = board.getBoundingClientRect();
      const cx = (ev.clientX - r.left) / zoom, cy = (ev.clientY - r.top) / zoom;
      if (!active) {
        if (Math.abs(cx - sx) * zoom < 5 && Math.abs(cy - sy) * zoom < 5) return;   // 살짝 움직인 건 클릭으로 처리
        active = true;
        const a = document.activeElement;
        if (a && a !== document.body) a.blur();
        document.body.classList.add('marquee-on');
        marquee.style.display = 'block';
      }
      const x1 = Math.min(sx, cx), y1 = Math.min(sy, cy), x2 = Math.max(sx, cx), y2 = Math.max(sy, cy);
      Object.assign(marquee.style, { left: x1 + 'px', top: y1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px' });
      const hit = new Set(base);
      notes.forEach(n => {
        const el = elOf(n);
        if (!el) return;
        if (n.x < x2 && n.x + el.offsetWidth > x1 && n.y < y2 && n.y + el.offsetHeight > y1) hit.add(n.id);
      });
      setSelection(hit);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (!active) return;
      suppressClick = true;
      marquee.style.display = 'none';
      document.body.classList.remove('marquee-on');
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });

  board.addEventListener('click', e => {
    if (e.target !== board) return;
    if (suppressClick) { suppressClick = false; return; }       // 영역 선택 직후의 클릭은 무시
    if (e.ctrlKey || e.metaKey) return;
    if (selected.size) { clearSelection(); wasEditing = false; return; }   // 선택 중이면 첫 클릭은 선택 해제만
    if (wasEditing) { wasEditing = false; return; }   // 입력 중이었으면 첫 클릭은 입력 종료만
    const r = board.getBoundingClientRect();
    addNote((e.clientX - r.left) / zoom, (e.clientY - r.top) / zoom);
  });

  // ---------- 단축키 ----------
  document.addEventListener('keydown', e => {
    const inText = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
    const modalOpen = modal.classList.contains('open');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inText && lastDeleted && lastDeleted.length) {
      e.preventDefault();
      const list = lastDeleted; lastDeleted = null;
      list.forEach(n => { n.z = ++maxZ; notes.push(n); makeNoteEl(n); });
      save(); fitBoard();
      statusEl.textContent = 'Restored';
    }
    // Ctrl + = / - / 0 : 확대 / 축소 / 100%
    if ((e.ctrlKey || e.metaKey) && !modalOpen && ['=', '+', '-', '0'].includes(e.key)) {
      e.preventDefault();
      if (e.key === '0') setZoom(1); else stepZoom(e.key === '-' ? -1 : 1);
    }
    // Ctrl+A: 전체 선택 / Delete·Backspace: 선택 삭제
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !inText && !modalOpen) {
      e.preventDefault();
      setSelection(notes.map(n => n.id));
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !inText && !modalOpen && selected.size) {
      e.preventDefault();
      deleteSelected();
    }
    if (e.key === 'Escape' && !inText && !paletteNote && !emojiNote && !modalOpen) clearSelection();
    if (e.key === 'Escape' && paletteNote) closePalette();
    if (e.key === 'Escape' && emojiNote) closeEmoji();
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // ---------- 순서대로 텍스트 정리 ----------
  // 가로 우선: 위치가 비슷한 높이(같은 줄)에 있는 메모끼리 묶고, 줄 안에서는 왼쪽→오른쪽
  // 세로 우선: 비슷한 가로 위치(같은 열)끼리 묶고, 열 안에서는 위→아래
  function readingOrder(mode) {
    const pool = selected.size ? selectedNotes() : notes;   // 선택된 메모가 있으면 그것만 정리
    const items = pool
      .filter(n => (n.text || '').trim())
      .map(n => {
        const el = elOf(n);
        const w = el ? el.offsetWidth : n.w, h = el ? el.offsetHeight : 60;
        return mode === 'col'
          ? { n, main: n.x, cross: n.y, size: w }
          : { n, main: n.y, cross: n.x, size: h };
      })
      .sort((a, b) => a.main - b.main);

    const groups = [];
    for (const it of items) {
      const g = groups[groups.length - 1];
      if (g && it.main < g.start + g.size * 0.6) g.items.push(it);
      else groups.push({ start: it.main, size: it.size, items: [it] });
    }
    return groups.flatMap(g => g.items.sort((a, b) => a.cross - b.cross).map(i => i.n));
  }

  function buildText() {
    const order = readingOrder(document.getElementById('optOrder').value);
    const fmt = document.getElementById('optFormat').value;
    return order.map((n, i) => {
      const lines = n.text.trim().split('\n');
      if (fmt === 'bullet') return '- ' + lines.join('\n  ');
      if (fmt === 'number') {
        const p = (i + 1) + '. ';
        return p + lines.join('\n' + ' '.repeat(p.length));
      }
      return lines.join('\n');
    }).join(fmt === 'blank' ? '\n\n' : '\n');
  }

  const modal = document.getElementById('modal');
  const outText = document.getElementById('outText');
  const copyMsg = document.getElementById('copyMsg');

  function openModal() {
    if (document.activeElement) document.activeElement.blur();
    outText.value = buildText();
    copyMsg.textContent = '';
    document.getElementById('scopeNote').textContent = selected.size ? `Selected notes only (${selected.size})` : '';
    modal.classList.add('open');
  }
  function closeModal() { modal.classList.remove('open'); }

  document.getElementById('btnCopy').addEventListener('click', openModal);
  document.getElementById('btnClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  ['optOrder', 'optFormat'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { outText.value = buildText(); copyMsg.textContent = ''; }));

  document.getElementById('btnDoCopy').addEventListener('click', async () => {
    const text = outText.value;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      outText.focus(); outText.select();
      try { document.execCommand('copy'); } catch (_) {}
    }
    copyMsg.textContent = 'Copied ✓';
  });

  // ---------- 내보내기 / 불러오기 / 지우기 ----------
  document.getElementById('btnExport').addEventListener('click', () => {
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0')
                + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    const blob = new Blob([JSON.stringify({ version: 1, notes }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `PinPen_${stamp}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  const fileInput = document.getElementById('fileInput');
  document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.notes)) throw new Error();
        if (notes.length && !confirm('Replace the current board with this file?')) return;
        notes = data.notes; renderAll(); save();
      } catch (e) { alert('This is not a Pin & Pen backup file (JSON).'); }
      fileInput.value = '';
    };
    reader.readAsText(f, 'utf-8');
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    if (!notes.length) return;
    if (!confirm('Delete all notes? (Export a backup first is recommended.)')) return;
    notes = []; lastDeleted = null; renderAll(); save();
  });

  window.addEventListener('resize', fitBoard);
  load();
  applyZoom();
})();
</script>
</body>
</html>
